[package]
name = "hongguo-standalone-signer"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
goblin = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uc = { package = "unicorn-engine-tci", version = "2.1.6", default-features = false, features = ["arch_aarch64"] }
aes = "0.8"
ctr = "0.9"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
